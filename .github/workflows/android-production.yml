name: Android Production Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-production.yml"

concurrency:
  group: android-production
  cancel-in-progress: false

jobs:
  release:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
            echo "No existing production tags, starting from v0.0.0"
          else
            echo "Latest tag: $LATEST_TAG"
          fi

          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          NEW_TAG="v$NEW_VERSION"

          VERSION_CODE=$(git rev-list --count HEAD)

          echo "New production version: $NEW_VERSION (tag: $NEW_TAG, code: $VERSION_CODE)"

          echo "version_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$NEW_TAG"      >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release-keystore.jks

      - name: Build release AAB
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload to Google Play — Production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shalev396.offdutycallfilter
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
          whatsNewDirectory: android/play_store_strings/whatsnew

      - name: Tag the production release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version_tag }}
          git push origin ${{ steps.version.outputs.version_tag }}
