name: Android Closed Testing Release

on:
  push:
    branches:
      - dev
    paths:
      - "android/**"
      - ".github/workflows/android-testing.yml"

concurrency:
  group: android-testing
  cancel-in-progress: true

jobs:
  testing:
    name: Build & Deploy to Closed Testing
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
            echo "No existing tags, starting from v0.0.0"
          else
            echo "Latest tag: $LATEST_TAG"
          fi

          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          VERSION_CODE=$(git rev-list --count HEAD)

          echo "New testing version: $NEW_VERSION (tag: $NEW_TAG, code: $VERSION_CODE)"

          echo "version_name=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$NEW_TAG"      >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Bump version in version.properties
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "VERSION_CODE=${{ steps.version.outputs.version_code }}" > android/version.properties
          echo "VERSION_NAME=${{ steps.version.outputs.version_name }}" >> android/version.properties

          git add android/version.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }} [skip ci]"
          git pull --rebase origin dev
          git push origin dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release-keystore.jks

      - name: Build release AAB
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Generate release notes
        run: |
          mkdir -p $RUNNER_TEMP/whatsnew
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Dev build ${{ steps.version.outputs.version_name }} — ${COMMIT_MSG}" > $RUNNER_TEMP/whatsnew/whatsnew-en-US

      - name: Upload to Google Play — Closed Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.shalev396.offdutycallfilter
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: alpha
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Create GitHub Release (also creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.version_tag }} \
            --prerelease \
            --title "${{ steps.version.outputs.version_tag }} (testing)" \
            --notes "Dev build ${{ steps.version.outputs.version_name }}" \
            --target dev
