plugins {
    id 'com.android.application'
}

def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionProps.load(versionFile.newReader())
}

def keystorePath = System.getenv("KEYSTORE_PATH") ?: "release-keystore.jks"
def keystoreFile = file(keystorePath)

android {
    namespace "com.shalev396.offdutycallfilter"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.shalev396.offdutycallfilter"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode = System.getenv("VERSION_CODE")?.toInteger() ?: (versionProps['VERSION_CODE']?.toInteger() ?: 1)
        versionName = System.getenv("VERSION_NAME") ?: (versionProps['VERSION_NAME'] ?: "0.0.1")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    if (keystoreFile.exists()) {
        signingConfigs {
            release {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation libs.androidx.constraintlayout
    implementation libs.google.gson
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
